preface:
  type: markdown
  eyebrow: 译序
  title: 为先进技术文化的传播添砖加瓦
  class: ddia-preface
  body: |
    > 不懂数据库的全栈架构师不是好架构师
    >
    > —— 冯若航（Vonng），2017，《DDIA》中文翻译

    现今，尤其是在互联网领域，大多数应用都属于数据密集型应用。本书从底层数据结构到顶层架构设计，将数据系统设计中的精髓娓娓道来。其中的宝贵经验无论是对架构师、DBA、还是后端工程师、甚至产品经理都会有帮助。

    这是一本理论结合实践的书，书中很多问题，译者在实际场景中都曾遇到过，读来让人击节扼腕。如果能早点读到这本书，该少走多少弯路啊！

    这也是一本深入浅出的书，讲述概念的来龙去脉而不是卖弄定义，介绍事物发展演化历程而不是事实堆砌，将复杂的概念讲述得浅显易懂，但又直击本质不失深度。每章最后的引用质量非常好，是深入学习各个主题的绝佳索引。

    本书为数据系统的设计、实现与评价提供了很好的概念框架。读完并理解本书内容后，读者可以轻松看破大多数的技术忽悠，与技术砖家撕起来虎虎生风。

    这是 2017 年译者读过最好的一本技术类书籍。这么好的书没有中文翻译，实在是遗憾。某不才，愿为先进技术文化的传播贡献一份力量。既可以深入学习有趣的技术主题，又可以锻炼中英文语言文字功底，何乐而不为？

chapters:
  type: cards
  eyebrow: 章节目录
  title: 从数据系统基础，到分布式与派生数据
  desc: 十四章沿着数据的生命周期展开：先建立系统基础，再穿过分布式难题，最终抵达派生数据与技术责任。
  class: ddia-chapters
  columns: 3
  items:
    - meta: 第一部分 · 第 1–5 章
      title: '[数据系统基础](part-i/)'
      desc: |
        1. [数据系统架构中的权衡](ch1/)
        2. [定义非功能性需求](ch2/)
        3. [数据模型与查询语言](ch3/)
        4. [存储与检索](ch4/)
        5. [编码与演化](ch5/)
    - meta: 第二部分 · 第 6–10 章
      title: '[分布式数据](part-ii/)'
      desc: |
        6. [复制](ch6/)
        7. [分片](ch7/)
        8. [事务](ch8/)
        9. [分布式系统的麻烦](ch9/)
        10. [一致性与共识](ch10/)
    - meta: 第三部分 · 第 11–14 章
      title: '[派生数据](part-iii/)'
      desc: |
        11. [批处理](ch11/)
        12. [流处理](ch12/)
        13. [流处理系统哲学](ch13/)
        14. [做正确的事](ch14/)


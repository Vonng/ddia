hero:
  eyebrow: DDIA · 第一版繁體中文翻譯
  title: 設計**資料密集型**應用
  lead: 完整保留第一版繁體中文譯文，沿著可靠性、分散式資料與衍生資料三條主線理解現代資料系統。
  note: 這是第一版閱讀入口；可隨時透過版本選單切換到第二版。
  image:
    light: title-v1.jpg
    dark: title-v1.jpg
    alt: 《設計資料密集型應用》第一版英文原書封面
  actions:
    - label: 查看完整目錄
      url: toc/
      icon: fa-solid fa-list
      style: primary
    - label: 從序言開始
      url: preface/
      icon: fa-solid fa-book-open
      style: ghost

metrics:
  eyebrow: 第一版
  title: 經典結構，完整保留
  desc: 第一版的章節與引用仍被廣泛使用，適合依序閱讀，也適合與第二版對照。
  columns: 4
  link_label: 查看
  items:
    - { value: '12', label: 章, desc: 從可靠性到資料系統的未來, icon: fa-solid fa-book, url: toc/ }
    - { value: '3', label: 部分, desc: 基礎、分散式與衍生資料, icon: fa-solid fa-layer-group, url: part-i/ }
    - { value: '4', label: 閱讀版本, desc: 兩版 × 簡繁中文, icon: fa-solid fa-language }
    - { value: '1', label: 開放專案, desc: 透過 GitHub 持續校訂, icon: fa-brands fa-github, url: https://github.com/Vonng/ddia, external: true }

gallery:
  eyebrow: 閱讀路線
  title: 第一版的三部分結構
  desc: 從單一資料系統的基本屬性出發，進入分散式機制，最後連接批次處理、串流處理與資料整合。
  columns: 3
  link_label: 進入本部分
  items:
    - title: 第一部分 · 資料系統基礎
      badge: 第 1–4 章
      icon: fa-solid fa-database
      desc: 可靠性、可伸縮性、可維護性，以及資料模型、儲存和編碼演化。
      url: part-i/
    - title: 第二部分 · 分散式資料
      badge: 第 5–9 章
      icon: fa-solid fa-network-wired
      desc: 複製、分割槽、事務、分散式系統故障，以及一致性與共識。
      url: part-ii/
    - title: 第三部分 · 衍生資料
      badge: 第 10–12 章
      icon: fa-solid fa-arrows-spin
      desc: 批次處理、串流處理、資料整合，以及資料系統未來的責任與選擇。
      url: part-iii/

principles:
  eyebrow: 這個閱讀站
  title: 舊版內容，現代閱讀體驗
  columns: 3
  items:
    - icon: fa-solid fa-magnifying-glass
      title: 搜尋與命令面板
      desc: 按 `⌘ K` 搜尋全文與常用操作，或按 `/` 直接執行閱讀、版本、語言和頁面命令。
    - icon: fa-solid fa-file-lines
      title: 可複製、可列印
      desc: 每頁提供文字複製、原始碼檢視與列印，並產生適合工具讀取的 `llms.txt`。
    - icon: fa-solid fa-code-pull-request
      title: 開放校訂
      desc: 頁面可直接跳轉 GitHub 編輯或提交問題，第一版內容同樣接受勘誤與改進。

faq:
  eyebrow: 閱讀之前
  title: 關於第一版與第二版
  items:
    - question: 為什麼仍然保留第一版？
      answer: 第一版擁有不同的章節組織，許多文章、課程與討論仍引用其中的章節編號。完整保留第一版，便於繼續閱讀舊連結並與第二版進行對照。
      open: true
    - question: 如何切換到第二版？
      answer: 使用頁面頂端的版本選單即可回到同一中文體例的第二版；語言選單則在簡體與繁體之間切換。
    - question: 這份譯文可以公開發行或用於商業用途嗎？
      answer: 不可以。本譯文僅供學習研究參考，不得公開傳播發行或用於商業用途；請購買正版支持作者與出版社。
      url: https://www.oreilly.com/library/view/designing-data-intensive-applications/9781491903063/
      link_label: 查看 O'Reilly 原版
      external: true
    - question: 如何提交勘誤？
      answer: 可使用頁面右側的編輯與問題入口，或直接前往 GitHub 提交 Issue 或 Pull Request。
      url: https://github.com/Vonng/ddia/issues
      link_label: 提交問題
      external: true


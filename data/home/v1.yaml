metrics:
  eyebrow: 第一版
  title: 经典结构，完整保留
  desc: 第一版的章节与引用仍被广泛使用，适合顺序阅读，也适合与第二版对照。
  columns: 4
  link_label: 查看
  items:
    - { value: '12', label: 章, desc: 从可靠性到数据系统的未来, icon: fa-solid fa-book, url: toc/ }
    - { value: '3', label: 部分, desc: 基础、分布式与派生数据, icon: fa-solid fa-layer-group, url: part-i/ }

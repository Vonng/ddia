preface:
  type: markdown
  eyebrow: Lời người dịch
  title: Góp một viên gạch cho việc lan tỏa tri thức công nghệ
  class: ddia-preface
  body: |
    > Kiến trúc sư full-stack mà không hiểu cơ sở dữ liệu thì chưa phải là kiến trúc sư giỏi.
    >
    > —— 冯若航 (Vonng), 2017, lời tựa bản dịch tiếng Trung DDIA

    Ngày nay, nhất là trong lĩnh vực Internet, phần lớn ứng dụng đều là ứng dụng chuyên sâu về dữ liệu. Cuốn sách này trình bày tinh hoa của việc thiết kế hệ thống dữ liệu, từ các cấu trúc dữ liệu tầng thấp đến thiết kế kiến trúc tầng cao. Những kinh nghiệm quý giá trong sách hữu ích cho kiến trúc sư, DBA, kỹ sư backend, và cả quản lý sản phẩm.

    Đây là cuốn sách kết hợp lý thuyết với thực tiễn: nhiều vấn đề được nêu trong sách là những gì người làm nghề đã từng gặp trong thực tế. Giá như được đọc sớm hơn, hẳn đã bớt được bao nhiêu đường vòng!

    Đây cũng là cuốn sách giải thích sâu sắc mà dễ hiểu: kể lại nguồn gốc của các khái niệm thay vì phô diễn định nghĩa, giới thiệu quá trình phát triển của sự vật thay vì chất đống dữ kiện; biến những khái niệm phức tạp thành dễ hiểu mà vẫn chạm đến bản chất. Danh mục tài liệu tham khảo cuối mỗi chương có chất lượng rất cao, là chỉ mục tuyệt vời để tìm hiểu sâu từng chủ đề.

    Sách cung cấp một khung khái niệm tốt để thiết kế, hiện thực và đánh giá các hệ thống dữ liệu. Đọc và hiểu sách rồi, bạn sẽ dễ dàng nhìn thấu phần lớn những lời "thổi phồng" công nghệ.

    Bản tiếng Việt được dịch dựa trên [bản dịch tiếng Trung](https://github.com/Vonng/ddia) của 冯若航 (Vonng) và cộng sự, đối chiếu với nguyên tác tiếng Anh của Martin Kleppmann và Chris Riccomini. Mong rằng bản dịch này góp một phần nhỏ giúp tri thức về hệ thống dữ liệu đến gần hơn với bạn đọc Việt Nam.


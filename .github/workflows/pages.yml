name: Vietnamese site (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.170.1

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # enableGitInfo: lastmod comes from history

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSL "$base/hugo_${HUGO_VERSION}_checksums.txt" | grep " ${archive}\$" | sha256sum -c -
          tar -xzf "$archive" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Check translation structure and links
        run: make vi-check ${{ steps.pages.outputs.base_url && format('BASE_URL={0}/', steps.pages.outputs.base_url) || '' }}

      - name: Glossary release gate
        if: github.event_name != 'pull_request'
        run: make vi-release-check

      - name: Build site (drafts excluded)
        run: make vi-build ${{ steps.pages.outputs.base_url && format('BASE_URL={0}/', steps.pages.outputs.base_url) || '' }}

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
